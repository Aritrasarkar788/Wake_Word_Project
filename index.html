<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Austral Project: Wake Word Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; background: #f4f6f9; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        button { background: #007bff; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0056b3; }
        .label-box { display: flex; justify-content: space-around; margin-top: 25px; }
        .score-card { background: #e9ecef; padding: 15px; border-radius: 8px; width: 40%; transition: 0.3s; }
        .high { background: #28a745 !important; color: white; font-weight: bold; }
        #status { color: #6c757d; margin: 15px 0; font-size: 14px; font-weight: bold; }
        #debug-log { background: #fff3f3; color: #dc3545; padding: 10px; margin-top: 20px; border-radius: 6px; font-family: monospace; font-size: 12px; text-align: left; display: none; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="card">
    <h2>🗣️ "hey_dragon" Live Detector</h2>
    <div id="status">Status: Preparing tinyML WebAssembly Context...</div>
    <button id="startBtn" style="display:none;">Start Live Listening</button>

    <div class="label-box">
        <div id="noiseBox" class="score-card">
            <div>Noise</div>
            <h3 id="noiseScore">0.0%</h3>
        </div>
        <div id="dragonBox" class="score-card">
            <div>hey_dragon</div>
            <h3 id="dragonScore">0.0%</h3>
        </div>
    </div>
    
    <div id="debug-log"></div>
</div>

<script>
    const startBtn = document.getElementById('startBtn');
    const statusDiv = document.getElementById('status');
    const logDiv = document.getElementById('debug-log');
    let classifier;

    window.addEventListener('error', function(e) {
        logDiv.style.display = 'block';
        logDiv.innerHTML += '<strong>Runtime Trace:</strong> ' + e.message + '<br>';
    });

    // Configure the baseline runner framework module layout safely
    window.Module = {
        locateFile: function(path) {
            // Force the runtime engine to always locate the WebAssembly binary in your local directory
            return window.location.origin + '/' + path;
        },
        onRuntimeInitialized: async function() {
            try {
                statusDiv.innerText = "Extracting neural network structural layouts...";

                // Dynamic fallback scanner to bind whichever constructor class your version exported
                const TargetClassifier = window.EdgeImpulseClassifier || (window.Module && window.Module.EdgeImpulseClassifier);

                if (!TargetClassifier) {
                    // If it is wrapped deep, fallback safely to standard module mapping injection
                    if (typeof EdgeImpulseClassifier !== 'undefined') {
                        classifier = new EdgeImpulseClassifier(window.Module);
                    } else {
                        throw new Error("EdgeImpulseClassifier definition not initialized. Attempting fallback bundle mapping...");
                    }
                } else {
                    classifier = new TargetClassifier(window.Module);
                }

                await classifier.init();
                statusDiv.innerText = "Model loaded successfully! Click below to stream mic audio.";
                startBtn.style.display = 'inline-block';

            } catch (err) {
                statusDiv.innerText = "Initialization crashed during loop.";
                logDiv.style.display = 'block';
                logDiv.innerHTML += '<strong>Verification Trace Error:</strong> ' + err.message + '<br>';
            }
        }
    };
</script>

<!-- Load the standardized Edge Impulse audio processing library directly over CDN to prevent GitHub/Vercel network corruption issues -->
<script src="https://jsdelivr.net" onerror="statusDiv.innerText='CDN Link blocked by local network profile configuration.'"></script>

<script>
    startBtn.onclick = async () => {
        statusDiv.innerText = "Requesting phone microphone permission...";
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            statusDiv.innerText = "Microphone connected! Processing stream inference metrics...";
            startBtn.style.display = 'none';

            const targetSampleRate = classifier.properties.frequency || 16000; 
            const windowSizeMs = classifier.properties.window_size_ms || 1000;
            
            const audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: targetSampleRate });
            const source = audioContext.createMediaStreamSource(stream);
            const processor = audioContext.createScriptProcessor(4096, 1, 1);

            source.connect(processor);
            processor.connect(audioContext.destination);

            let audioBuffer = [];
            const requiredSamples = Math.floor(targetSampleRate * (windowSizeMs / 1000));

            processor.onaudioprocess = (e) => {
                const inputData = e.inputBuffer.getChannelData(0);
                audioBuffer.push(...inputData);

                if (audioBuffer.length >= requiredSamples) {
                    const chunk = audioBuffer.slice(-requiredSamples);
                    
                    try {
                        let result = classifier.classify(chunk);
                        let scores = {};
                        result.results.forEach(r => { scores[r.label] = r.value; });

                        const noiseVal = (scores['Noise'] || 0) * 100;
                        const dragonVal = (scores['hey_dragon'] || 0) * 100;

                        document.getElementById('noiseScore').innerText = noiseVal.toFixed(1) + "%";
                        document.getElementById('dragonScore').innerText = dragonVal.toFixed(1) + "%";

                        document.getElementById('noiseBox').className = `score-card ${noiseVal > 70 ? 'high' : ''}`;
                        document.getElementById('dragonBox').className = `score-card ${dragonVal > 70 ? 'high' : ''}`;

                    } catch (err) {
                        console.error("Classification loop broken:", err);
                    }

                    audioBuffer = audioBuffer.slice(-Math.floor(requiredSamples / 2));
                }
            };
        } catch (err) {
            statusDiv.innerText = "Microphone link failed.";
            alert("Mic Error: " + err.message);
        }
    };
</script>

</body>
</html>
